name: SmartRFP CD

on:
  workflow_run:
    workflows: ["SmartRFP CI"]
    types:
      - completed

jobs:

  deploy-backend:

    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'

    runs-on: ubuntu-latest

    environment: Production

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Deploy Backend
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.BACKEND_APP_NAME }}
          publish-profile: ${{ secrets.BACKEND_PUBLISH_PROFILE }}
          package: .

      - name: Wait for Backend
        run: sleep 30

      - name: Backend Health Check
        run: |
          curl --fail https://${{ secrets.BACKEND_APP_NAME }}.azurewebsites.net/health

  deploy-frontend:

    needs: deploy-backend

    runs-on: ubuntu-latest

    environment: Production

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Deploy Frontend
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.FRONTEND_APP_NAME }}
          publish-profile: ${{ secrets.FRONTEND_PUBLISH_PROFILE }}
          package: .

      - name: Wait for Frontend
        run: sleep 30

      - name: Frontend Health Check
        run: |
          curl --fail https://${{ secrets.FRONTEND_APP_NAME }}.azurewebsites.net
